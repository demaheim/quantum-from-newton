[project]
name = "quantum-from-newton"
version = "1.0.0"
description = "Newtonian simulation of a companion-particle chain reproducing the predictions of the Schrodinger equation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Dennis M. Heim", email = "physics@d-heim.de" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
Manuscript = "https://github.com/demaheim/micro-force-manuscript"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantum_from_newton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: reproduces a published figure; runs the full relaxation"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
